services:
  - type: worker
    name: nexora-elite-signals-worker
    runtime: docker
    repo: https://github.com/nexoraadmi007-a11y/Nexora-Sport-Trading.git
    branch: main
    plan: starter
    region: frankfurt
    dockerfilePath: ./infrastructure/docker/Dockerfile.worker
    dockerContext: .
    autoDeploy: true
    maxShutdownDelaySeconds: 30
    disk:
      name: nexora-cache
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXORA_CACHE_DIR
        value: /var/data/nexora-cache
      - key: MAX_DAILY_SIGNALS
        value: "5"
      - key: MAX_ELITE_SIGNALS_PER_BATCH
        value: "2"
      - key: SCAN_TIMES_WAT
        value: "09:30,13:30,17:30"
      - key: API_DAILY_CALL_LIMIT
        value: "250"
      - key: API_HOURLY_CALL_LIMIT
        value: "35"
      - key: ODDS_API_DAILY_CALL_LIMIT
        value: "205"
      - key: ODDS_API_HOURLY_CALL_LIMIT
        value: "28"
      - key: SPORTSDATAIO_DAILY_CALL_LIMIT
        value: "45"
      - key: SPORTSDATAIO_HOURLY_CALL_LIMIT
        value: "6"
      - key: ODDS_TTL_0_6H_MINUTES
        value: "30"
      - key: ODDS_TTL_6_12H_HOURS
        value: "2"
      - key: ODDS_TTL_12H_PLUS_HOURS
        value: "4"
      - key: SPORTSDATAIO_PLAYER_STATS_TTL_HOURS
        value: "18"
      - key: ADDITIONAL_MARKET_WINDOW_HOURS
        value: "36"
      - key: NBA_H1_EVENT_LIMIT
        value: "2"
      - key: NBA_PLAYER_PROPS_EVENT_LIMIT
        value: "1"
      - key: BTTS_EVENT_LIMIT
        value: "6"
      - key: ODDS_ADDITIONAL_MARKET_REGIONS
        value: "uk"
      - key: FOOTBALL_SPORT_KEYS
        value: "soccer_epl,soccer_spain_la_liga,soccer_italy_serie_a,soccer_germany_bundesliga,soccer_france_ligue_one,soccer_saudi_arabia_pro_league,soccer_brazil_campeonato,soccer_brazil_serie_b,soccer_chile_campeonato,soccer_china_superleague,soccer_conmebol_copa_libertadores,soccer_conmebol_copa_sudamericana,soccer_finland_veikkausliiga,soccer_norway_eliteserien,soccer_sweden_allsvenskan,soccer_sweden_superettan,soccer_spain_segunda_division"
      - key: ENABLE_NBA_PLAYER_PROPS
        value: "false"
      - key: ENABLE_NBA_FIRST_HALF
        value: "false"
      - key: ENABLE_ODDS_API_NBA_EXTENDED_MARKETS
        value: "false"
      - key: ENABLE_MLB_GAME_TOTALS
        value: "true"
      - key: ENABLE_MLB_FIRST5
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: SPORTSDATAIO_NBA_API_KEY
        sync: false
      - key: SHARPAPI_API_KEY
        sync: false
      - key: ENABLE_SHARPAPI_FEED
        value: "false"
      - key: SHARPAPI_BASE_URL
        value: "https://api.sharpapi.io/api/v1"
      - key: SHARPAPI_SPORTSBOOKS
        value: "onexbet"
      - key: SHARPAPI_NBA_SPORT
        value: "basketball"
      - key: SHARPAPI_NBA_LEAGUE
        value: "nba"
      - key: SHARPAPI_NBA_MARKETS
        value: "total_points,team_total,player_prop,1st_half"
      - key: SHARPAPI_MLB_SPORT
        value: "baseball"
      - key: SHARPAPI_MLB_LEAGUE
        value: "mlb"
      - key: SHARPAPI_MLB_MARKETS
        value: "1st_half,total_points"
      - key: SHARPAPI_LIMIT
        value: "200"
      - key: SHARPAPI_TIMEOUT_MS
        value: "12000"
      - key: GOOGLE_SHEETS_WEBHOOK_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_DB_HOST
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: POSTGRESQL_DATABASE_URL
        sync: false
      - key: SUPABASE_POOLER_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
